<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nikel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body id="login">
  <main>
    <div class="container">
      <div class="row vh-100">
        <div class="col d-flex justify-content-center my-5 flex-column">
          <div class="text-login">
            <p>Organize suas finâncias de uma forma fácil.</p>
            <p>Controle seu dinheiro e investimentos.</p>
            <p>Economize e atinja seus objetivos.</p>
          </div>
          <div class="text-center">
            <img src="./assets/images/pocket.png" alt="image pocket" class="img-fluid" srcset="">
            <img src="./assets/images/coins.png" alt="image coins" class="img-fluid d-none d-md-inline coins" srcset="">
          </div>
        </div>
        <div class="col d-flex justify-content-center my-5 flex-column">
          <div class="container">
            <div class="row">
              <div class="col">
                <div class="text-center mb-3">
                  <img src="./assets/images/nikel-logo.png" alt="logo nikel" class="img-fluid" srcset="">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col">
                <form>
                  <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                    <div id="emailHelp" class="form-text">Utilize seu e-mail para realizar o login.</div>
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="exampleInputPassword1">
                  </div>
                  <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Permanecer conectado.</label>
                  </div>
                  <button type="submit" class="btn button-login">Entrar</button>
                </form>
              </div>
            </div>
            <div class="row">
              <div class="col">
                <p class="text-center mt-2 form-text">Ainda não tem conta? <span class="link-default">Criar uma conta.</span></p>
              </div>
            </div>
            <div class="row">
              <div class="col">
                <div class="text-center mt-5">
                  <img src="./assets/images/codai-logo.png" alt="logo codai" srcset="">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col">
                <div class="text-center">
                  <img src="./assets/images/growdev-logo.png" alt="logo growdev" srcset="">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Button trigger modal -->
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
      Launch demo modal
    </button>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            ...
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary">Save changes</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
